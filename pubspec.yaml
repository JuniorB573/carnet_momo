name: carnet_momo
description: Carnet MoMo — gestion des commissions pour agents mobile money
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.2.1
  crypto: ^3.0.3
  supabase_flutter: ^2.5.6
  share_plus: ^13.3.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  pdf: ^3.11.1
  google_fonts: ^6.2.1
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
